name: CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: web

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: treesdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/treesdb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # web/package.json has no "packageManager" field (checked at the time
      # this workflow was written), so pnpm is provisioned via
      # pnpm/action-setup rather than corepack. If a packageManager field is
      # added later, prefer switching this to `corepack enable`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Schema + migrations land from a parallel task (P0-02). Guard on
      # whether any migration SQL has been committed yet so this workflow
      # doesn't fail the build in the meantime; once migrations exist these
      # steps run for real and vitest's db/**/*.test.ts suites get a live,
      # seeded database to run against.
      - name: Run migrations
        if: hashFiles('web/db/migrations/**/*.sql') != ''
        run: pnpm db:migrate

      - name: Install postgresql-client
        if: hashFiles('web/db/migrations/**/*.sql') != ''
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Seed database
        if: hashFiles('web/db/migrations/**/*.sql') != ''
        run: psql "$DATABASE_URL" -f db/seed/seed.sql

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # dump-legacy.ps1 was written for Windows PowerShell 5.1; the "Sync live
  # data" workflow runs it on Linux under pwsh 7 with go-sqlcmd. This checks
  # that path without a database (see scripts/ci/check-dump-script.sh).
  dump-script:
    runs-on: ubuntu-latest

    # Throwaway SQL Server for the go-sqlcmd output check. The password is a
    # CI-only value for this container, not a real credential.
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-only-Passw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci-only-Passw0rd!' -C -Q 'SELECT 1' -b"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=20s

    env:
      MSSQL_SA_PASSWORD: Ci-only-Passw0rd!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install sqlcmd
        run: scripts/ci/install-go-sqlcmd.sh

      - name: Check the dump script on Linux
        run: scripts/ci/check-dump-script.sh
