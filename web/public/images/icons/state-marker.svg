<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-hidden="true">
  <!-- Dark keyline so the chip separates from any tile color (map UX audit:
       the old white-chip + hairline amber ring measured 1.3-2.2:1 against
       every OSM surface - and states are the only markers visible at the
       landing zoom). -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#0F172A" stroke-width="2" opacity="0.42" />
  <!-- White casing ring. -->
  <circle cx="32" cy="32" r="26" fill="#ffffff" />
  <!-- Solid brand-amber body with a DARK glyph (6.3:1) - mirrors the app's
       amber badge + dark text pairing; a white glyph on this amber would
       only reach 2.15:1. -->
  <circle cx="32" cy="32" r="22" fill="#f0a020" />
  <!-- Five-point star glyph (lucide Star, FILLED - see tree-marker.svg's note). -->
  <g transform="translate(18,18) scale(1.16667)" fill="#3F2A05" stroke="none">
    <path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" />
  </g>
</svg>
